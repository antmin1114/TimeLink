<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750A4">
  <title>TimeLink 예약</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f2fa;
      color: #1d1b20;
    }
    main {
      width: min(32rem, calc(100% - 3rem));
      padding: 2rem;
      box-sizing: border-box;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 10%);
      text-align: center;
    }
    h1 { margin-top: 0; color: #6750a4; }
    p { line-height: 1.6; }
    #link-id { font-weight: 700; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1b20; color: #e6e1e5; }
      main { background: #211f26; }
      h1 { color: #d0bcff; }
    }
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border: 0;
      border-radius: 0.8rem;
      background: #6750a4;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>TimeLink</h1>
    <p>TimeLink 앱에서 예약 가능한 시간을 확인하고 예약을 신청할 수 있습니다.</p>
    <p>앱이 설치되어 있다면 이 링크를 다시 열어 주세요.</p>
    <p id="link-row" hidden>예약 링크 ID: <span id="link-id"></span></p>
    <button id="open-app-button" type="button" hidden>
          TimeLink 앱에서 열기
    </button>
  </main>
  <script>
      const match = location.pathname.match(/^\/host\/([^/]+)\/?$/);

      if (match) {
        const hostId = decodeURIComponent(match[1]);

        document.querySelector("#link-id").textContent = hostId;
        document.querySelector("#link-row").hidden = false;

        const openAppButton = document.querySelector("#open-app-button");
        openAppButton.hidden = false;

        openAppButton.addEventListener("click", () => {
          const encodedHostId = encodeURIComponent(hostId);

          const intentUrl =
            `intent://host/${encodedHostId}` +
            `#Intent;` +
            `scheme=timelink;` +
            `package=com.kkm.timelink;` +
            `end`;

          document.querySelector("#link-id").textContent = intentUrl;

          location.href = intentUrl;

        });
      }
  </script>
</body>
</html>
